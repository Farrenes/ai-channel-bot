services:
  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      scoring-service:
        condition: service_healthy
    restart: unless-stopped

  admin-bot:
    build: .
    command: ["python", "admin_bot.py"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scoring-service:
    build:
      context: .
      dockerfile: Dockerfile.scoring
    env_file: .env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_channel_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
